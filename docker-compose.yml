# Local supporting infrastructure for TRITON-ML development.
#
# This file provisions storage and dashboards only. TRITON-ML itself is not
# containerised: there is no Dockerfile in this repository, so run the package
# from a local virtualenv (see README "Quick Start").
#
# Copy .env.example to .env and set the passwords before starting:
#   cp .env.example .env && docker compose up -d

services:
  # -- TimescaleDB for time-series sensor storage -------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: triton-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - triton-net

  # -- Grafana for dashboards and alert visualization ---------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: triton-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - triton-net

volumes:
  tsdb-data:
  grafana-data:

networks:
  triton-net:
    driver: bridge
