[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-ml"
version = "0.4.0"
description = "Predictive maintenance ML pipeline for ship machinery — fault classification, RUL estimation, and anomaly detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Herman Doronin", email = "herherman030303@gmail.com" },
]
keywords = ["predictive-maintenance", "maritime", "machinery", "rul", "cbm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0,<3.0",   # shap TreeExplainer cannot parse XGBoost 3.x multiclass base_score
    "shap>=0.43",
    "torch>=2.1",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# ruff and mypy are pinned to exact versions: ruff's default rule set and mypy's
# inference both change between minor releases, which turns CI red without a
# single source change. Bump them deliberately, not implicitly.
# types-PyYAML gives config.py real types for yaml.safe_load instead of Any.
dev = [
    "pytest>=7.4",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["triton_ml*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

# scipy, scikit-learn, shap and onnxruntime ship neither inline types nor a stub
# package, so mypy cannot see into them. They are listed one by one instead of
# setting a global ignore_missing_imports, so that adding another untyped
# dependency stays a conscious decision rather than something CI silently accepts.
[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "shap.*",
    "onnxruntime.*",
]
ignore_missing_imports = true
